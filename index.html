<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title></title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<script>
(function () {
    "use strict";

    try {
        var params = new URLSearchParams(window.location.search);
        var t = params.get("t");
        var h = params.get("h");

        // 校验 token：最短3字符，拦注入和路径穿越
        function validToken(val) {
            if (!val || typeof val !== "string") return false;
            var s = val.trim();
            if (s.length < 3 || s.length > 200) return false;
            if (s.indexOf("..") !== -1) return false;
            if (/[<>"'\x00-\x1f\x7f]/.test(s)) return false;
            return true;
        }

        // 拦危险协议
        function safeUrl(url) {
            var low = url.toLowerCase();
            return !/^(javascript:|data:|vbscript:|file:)/.test(low);
        }

        var shareBase = "https://4m4k5r13hq880.doubaoapps.com/app/app_17etv9ywcge/share/";
        var apiBase   = "https://4m4k5r13hq880.doubaoapps.com/app/app_17fnup2xjm6/api/s/";

        // 优先 t
        if (validToken(t)) {
            var urlT = shareBase + encodeURIComponent(t.trim());
            if (safeUrl(urlT)) {
                setTimeout(function () {
                    window.location.replace(urlT);
                }, 300);
                return;
            }
        }

        // 其次 h，末尾加 /
        if (validToken(h)) {
            var urlH = apiBase + encodeURIComponent(h.trim()) + "/";
            if (safeUrl(urlH)) {
                setTimeout(function () {
                    window.location.replace(urlH);
                }, 300);
                return;
            }
        }

        // 都不合法：空白页
        document.documentElement.remove();

    } catch (e) {
        document.documentElement.remove();
    }
})();
</script>
</head>
<body>
</body>
</html>
